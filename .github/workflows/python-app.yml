# This workflow will install Python dependencies and run tests with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v3
      with:
        python-version: "3.14"
        cache: 'pip' # caching pip dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Run unittests
      run: |
        PYTHONPATH=src python -m unittest discover tests/utils/
        PYTHONPATH=src python -m unittest discover tests/tracking/
        PYTHONPATH=src python -m unittest discover tests/general/
        PYTHONPATH=src python -m unittest discover tests/analysis/
        PYTHONPATH=src python -m unittest discover tests/data/
